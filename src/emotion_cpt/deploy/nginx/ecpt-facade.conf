    # --- Emotion-CPT 统一门面（/ecpt/）：门户 + 同票并排 + 两个看板入口 ---
    #
    # 2026-10-26 变更：
    #   ① 原 ``/dsh/`` 兼容别名**取消** ⇒ ``/dsh/`` 正式归 DeepSeek Harness；
    #   ② CPT（/cpt/）与 emotion（/emotion/）**收编**进 /ecpt/ ⇒ 三合一入口；
    #   ③ 本片段现在是「/ecpt/ 之下所有 location」的**唯一真相源**，
    #      由 scripts/install_nginx_route.sh 以**标记区间替换**方式装到线上。
    #
    # 2026-10-26 变更：
    #   ④ **旧路径兼容跳转全部删除**（``/cpt/``、``/emotion/``）
    #      ⇒ 入口只剩一个（``/ecpt/…``），旧链接直接 404（不再偷偷活着）。
    #
    # ⚠️ 必须带认证：聚合页会显示买卖点、持仓建议、策略理由 —— 这些是**持仓口径**，
    #    不该比 /dashboard/ 更宽松。（2026-10-24 首次上线时漏了，外部直接 200，已补）
    location /ecpt/ {
        auth_basic "Restricted";
        auth_basic_user_file /etc/nginx/.htpasswd;
        proxy_pass http://127.0.0.1:8092/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # ★ 告诉门面自己挂在哪个前缀下 —— 门面据此拼自己的入口链接
        #   （CPT / emotion / 同票并排 三个链接都要带这个前缀）。
        proxy_set_header X-Forwarded-Prefix /ecpt/;
        proxy_read_timeout 60s;
    }

    # --- CPT 看板（收编进 /ecpt/）---
    # ⚠️ 前缀从 /cpt/ 变成 /ecpt/cpt/ ⇒ CPT 前端**必须**运行时推导基址，
    #    否则它写死的 /cpt/... 资源与 API 会 404。
    location /ecpt/cpt/api/ {
        auth_basic "Restricted";
        auth_basic_user_file /etc/nginx/.htpasswd;
        proxy_pass http://127.0.0.1:8010/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
    }
    location = /ecpt/cpt/ {
        auth_basic "Restricted";
        auth_basic_user_file /etc/nginx/.htpasswd;
        root /var/www/cpt-dashboard;
        try_files /index.html =404;
    }
    location = /ecpt/cpt/track/ {
        auth_basic "Restricted";
        auth_basic_user_file /etc/nginx/.htpasswd;
        root /var/www/cpt-dashboard;
        try_files /track.html =404;
    }
    location /ecpt/cpt/ {
        auth_basic "Restricted";
        auth_basic_user_file /etc/nginx/.htpasswd;
        alias /var/www/cpt-dashboard/;
        try_files $uri $uri/ =404;
    }

    # --- emotion-core 看板（收编进 /ecpt/）---
    # ⚠️ 8098 的 BASE_PATH 由环境变量 EMOTION_BASE_PATH 决定 ⇒ 必须与本前缀一致，
    #    否则它模板里 {{ base_path }} 生成的链接会指向旧路径。
    location /ecpt/emotion/ {
        auth_basic "Emotion Core";
        auth_basic_user_file /etc/nginx/.htpasswd;
        proxy_pass http://127.0.0.1:8098/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # --- 旧路径 → 新路径（兼容跳转）已**全部删除**（2026-10-26）---
    #
    # ⚠️ 为什么要删干净：
    #    ``/cpt/``、``/emotion/`` 是上一轮入口重排留下的**兼容跳转**。
    #    它们的唯一作用是让**旧链接**继续活 ⇒ 但代价是：
    #      ① 同一个应用有**两个**入口 ⇒ 排查时容易怀疑错方向；
    #      ② 谁把旧路径抄进文档/脚本，就会**静默**依赖它；
    #      ③ 删掉它们才能证明「入口只有一个」不是嘴上说说。
    #    ⇒ owner 拍板：「干干净净的最好」⇒ 本片段里**不再有任何旧路径跳转**。
    #
    # ⚠️ 删之前必须先确认没有东西在用旧路径（2026-10-26 已查）：
    #    · CPT 看板前端：``/cpt/`` 只出现在**注释**里（基址运行时推导）⇒ 不受影响；
    #    · 采集器安装脚本（``_pkg/run*.sh``）：**真写死**了 ``/cpt/_pkg/``
    #      ⇒ 已同步改成 ``/ecpt/cpt/_pkg/``（含 /var/www 部署副本与仓内源）；
    #    · emotion-core：``/emotion/`` 只出现在注释里 ⇒ 不受影响。
