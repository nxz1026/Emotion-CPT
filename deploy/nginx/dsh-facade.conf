# Emotion-CPT 统一入口（门户 + 同票并排聚合页）—— 2026-10-24
#
# 插入到 /etc/nginx/sites-available/dsh-web 的 server 块内。
# 门户页在 /dsh/；CPT 与 emotion 的看板仍由各自既有 location 反代
# （/cpt/、/emotion/），**前端代码不搬、进程不合**。
#
# 改法：备份 → 插入 → nginx -t → reload（不要 restart）。
    # --- Emotion-CPT 统一门面 ---
    location /dsh/ {
        # ⚠️ 必须带认证：与 /cpt/、/emotion/、/dashboard/ 同款。
        # 聚合页会显示买卖点、持仓建议、策略理由 —— 这些是**持仓口径**，
        # 不该比它们更宽松。（2026-10-24 首次上线时漏了，外部直接 200，已补）
        auth_basic "Restricted";
        auth_basic_user_file /etc/nginx/.htpasswd;
        proxy_pass http://127.0.0.1:8092/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
