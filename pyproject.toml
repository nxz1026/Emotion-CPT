[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "emotion-cpt"
version = "0.8.0"
description = "CPT × emotion-core 的统一层：跨项目契约、统一数据层、统一 web 入口"
requires-python = ">=3.12"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "nxz1026" }]
keywords = ["contracts", "chan-theory", "astock", "governance"]

# 核心刻意**零依赖**：契约层要能被任何环境 import（包括上游的严格零依赖环境）。
dependencies = []

[project.optional-dependencies]
# 只有需要连库的工具（探针 / manifest 比对）才要 psycopg。
db = ["psycopg[binary]>=3.1,<4"]
dev = ["pytest>=8.0", "ruff>=0.6.0", "mypy>=1.10", "import-linter>=2.0"]

[project.scripts]
emotion-cpt-check-contracts = "emotion_cpt.cli.check_contracts:main"
emotion-cpt-check-manifest  = "emotion_cpt.cli.check_manifest:main"
emotion-cpt-check-crontab   = "emotion_cpt.cli.check_crontab:main"
emotion-cpt-check-units     = "emotion_cpt.cli.check_unit_paths:main"
emotion-cpt-probe           = "emotion_cpt.cli.probe:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["emotion_cpt*"]

[tool.setuptools.package-data]
# ★ unit 真相源随包分发：任何装了契约包的仓都能读到它
#   （emotion-core 的架构测试据此做**跨仓**对账，而不是各读各的副本）
emotion_cpt = ["deploy/systemd/*.service", "deploy/systemd/*.timer", "deploy/systemd/*.md"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# 门禁的 docstring 里有 **markdown 表格** —— 表格行折行会破坏表格结构，
# 只能整行留着 ⇒ 豁免 E501（其余规则照常）。
"src/emotion_cpt/cli/check_contracts.py" = ["E501"]
"src/emotion_cpt/cli/check_doc_drift.py" = ["E501"]

[tool.mypy]
strict = true
python_version = "3.12"
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra -q"
