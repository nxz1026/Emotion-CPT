name: Emotion-CPT CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12 = pyproject 声明的下限；3.14 = 开发机 .venv 的生成版本
        # （与两个上游仓对齐，避免"本地全绿 ≠ CI 绿"）
        python-version: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest tests -q
      - name: Lint
        run: |
          python -m ruff check src tests scripts
      - name: Contract self-test (门禁必须能报错)
        # 纪律：自制的验证工具第一版基本都错 —— 必须确认门禁还能报
        run: python -m pytest tests/test_gate_selftest.py -q
      - name: 文档漂移门禁（文档 ↔ 代码）
        # 契约数字的机器可读真源是 CONTRACTS.md 里的 contract-facts 块
        # ⇒ 代码改了数字而文档没改 ⇒ 这里会红
        run: python -m emotion_cpt.cli.check_doc_drift
      - name: 文档漂移门禁自证（必须还能报）
        run: python -m pytest tests/test_doc_drift_selftest.py -q
      - name: 交叉引用生成物一致（docs/CROSS-REFERENCES.md 不得手改）
        # 交叉引用是**生成**的；手改会在下一次重算时被覆盖 ⇒ 这里直接拦住
        run: python scripts/gen_cross_references.py --check

  contract-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: 依赖方向门禁（本仓不得 import 上游）
        run: python -m emotion_cpt.cli.check_contracts --upstream-root /nonexistent || true
      - name: 契约指纹
        run: python -m emotion_cpt.cli.probe --fingerprint-only
