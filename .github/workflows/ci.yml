name: Emotion-CPT CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12 = pyproject 声明的下限；3.14 = 开发机 .venv 的生成版本
        # （与两个上游仓对齐，避免"本地全绿 ≠ CI 绿"）
        python-version: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest tests -q
      - name: Lint
        run: |
          python -m ruff check src tests scripts
      - name: Contract self-test (门禁必须能报错)
        # 纪律：自制的验证工具第一版基本都错 —— 必须确认门禁还能报
        run: python -m pytest tests/test_gate_selftest.py -q
      - name: 文档漂移门禁（文档 ↔ 代码）
        # 契约数字的机器可读真源是 CONTRACTS.md 里的 contract-facts 块
        # ⇒ 代码改了数字而文档没改 ⇒ 这里会红
        run: python -m emotion_cpt.cli.check_doc_drift
      - name: 文档漂移门禁自证（必须还能报）
        run: python -m pytest tests/test_doc_drift_selftest.py -q
      - name: 交叉引用生成物一致（docs/CROSS-REFERENCES.md 不得手改）
        # 交叉引用是**生成**的；手改会在下一次重算时被覆盖 ⇒ 这里直接拦住
        run: python scripts/gen_cross_references.py --check
      - name: 部署隔离说明的静态部分与生成器一致
        # 归属分组（谁负责哪些作业/单元）是**声明**出来的 ⇒ 不能手改
        run: python scripts/gen_deployment_isolation.py --check
      - name: 公网反代门禁（Emotion-CPT 的路径必须已注册且要鉴权）
        # 「反代齐平」不能只是一句声明 ⇒ 配置被无声删掉时要能报出来。
        # CI 里没有公网 ⇒ 活体判据自动跳过，只校验静态一致。
        run: python -m emotion_cpt.cli.check_nginx_route --skip-live
      - name: portal 镜像旁观门禁（只读，不碰 portal 仓）
        # owner 裁决 Q7=C「不动 portal 仓」⇒ 本仓**只读**它的镜像做三方对账，
        # 抓住 unit 漂移。portal 仓不在本机时自动跳过（不算通过也不算失败）。
        run: python -m emotion_cpt.cli.check_portal_mirror
      - name: portal 镜像门禁自证（必须还能报）
        run: python -m pytest tests/test_portal_mirror_gate.py -q
      - name: 隔离性自证（上游全挂时门面必须照常工作）
        # 「独立故障域」不是设计声明，是会失败的断言
        run: python -m pytest tests/test_facade_isolation.py -q

  contract-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: 依赖方向门禁（本仓不得 import 上游）
        run: python -m emotion_cpt.cli.check_contracts --upstream-root /nonexistent || true
      - name: 契约指纹
        run: python -m emotion_cpt.cli.probe --fingerprint-only
